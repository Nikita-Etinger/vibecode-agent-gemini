<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 220px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 12px; background: #1e1e1e; color: #d4d4d4; }
    h3 { margin: 0 0 10px 0; font-size: 14px; color: #a594fd; }
    .setting { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .3s; border-radius: 22px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #6a5acd; }
    input:checked + .slider:before { transform: translateX(18px); }
    .status { margin-top: 8px; font-size: 11px; color: #888; }
  </style>
</head>
<body>
  <h3>Vibecode Agent</h3>
  <div class="setting">
    <span>Авто-инжект в чат</span>
    <label class="switch">
      <input type="checkbox" id="injectToggle">
      <span class="slider"></span>
    </label>
  </div>
  <div class="status" id="statusText">Статус: Активен</div>
  <script src="popup.js"></script>
</body>
</html>
